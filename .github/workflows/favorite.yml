name: favorite

# THE ONLY STRATEGY RUNNING. Favourite-bias maker model, live on real Kalshi.
#
# Every other model is retired: their workflows are deleted and their recorded
# results (Brier worse than a coin flip, negative CLV) are in the README.
#
# STOPPING IT: set repo Variable KILL_SWITCH=true. That blocks every order at
# the safety gate, from a phone, with no code change. DRY_RUN=true is the
# softer option — it logs the exact orders and sends nothing.
#
# SIZE: units come from sizing.py (Kelly on each signal's own edge), not a flat
# stake. The SPORTS step runs FULL Kelly capped at 20% of bankroll (owner call,
# 2026-08-08) — on a $40 bankroll that is up to ~$8 a bet. Four ceilings sit
# above it: the sizing model's own MAX_BANKROLL_PCT, MAX_ORDER_BANKROLL_PCT at
# the safety gate, the absolute MAX_ORDER_ABS, and SPORTS_MAX_DAILY_USD, which
# is the only one that bounds a DAY rather than a single order.
#
# CADENCE: deliberately 30 minutes, not tighter. Two separate GitHub behaviours
# punish a fast cron:
#   1. Scheduled runs are silently dropped under load — the old 15-minute cron
#      produced ~14 runs/day, not 96.
#   2. A run that queues without a free runner is SUPERSEDED by the next run in
#      the same concurrency group. On 2026-08-06 runners stalled for ~15 min and
#      every '*/20' run was cancelled before it started, so the bot placed
#      nothing for hours while still looking scheduled.
# A 30-minute gap gives a queued run time to be picked up before its successor
# cancels it. Signals require 2h+ to close, so a sparse cadence still captures a
# closing line.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log orders without sending them'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: favorite
  cancel-in-progress: false

env:
  STATE_FILES: paper_trades_favorite.csv paper_trades_sports.csv sports_line_history.json odds_quota.json odds_cache.json clv_sports.csv CLV_SCOREBOARD.md executed_trades.csv live_scan.csv

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Write Kalshi key
        env:
          KALSHI_PEM: ${{ secrets.KALSHI_PRIVATE_KEY_PEM }}
        run: printf '%s\n' "$KALSHI_PEM" > kalshi_prod.pem

      - name: Restore state from the bot-state branch
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin bot-state >/dev/null; then
            git fetch --depth=1 origin bot-state
            for f in $STATE_FILES; do
              if git cat-file -e origin/bot-state:"$f" 2>/dev/null; then
                git show origin/bot-state:"$f" > "$f"
                echo "restored $f"
              fi
            done
          else
            echo "no bot-state branch yet — starting fresh"
          fi

      - name: Scan, size and place maker orders
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY_PATH: kalshi_prod.pem
          KALSHI_ENV: ${{ vars.KALSHI_ENV || 'prod' }}
          KILL_SWITCH: ${{ vars.KILL_SWITCH || 'false' }}
          DRY_RUN: ${{ inputs.dry_run || vars.DRY_RUN || 'false' }}
          # --- safety gate ceilings (independent of the sizing model) ---
          MAX_ORDER_SIZE: ${{ vars.MAX_ORDER_SIZE || '3' }}
          MAX_TOTAL_EXPOSURE: ${{ vars.MAX_TOTAL_EXPOSURE || '45' }}
          MAX_ORDER_BANKROLL_PCT: ${{ vars.MAX_ORDER_BANKROLL_PCT || '5' }}
          MAX_ORDER_ABS: ${{ vars.MAX_ORDER_ABS || '5' }}
          MAX_EXPOSURE_BANKROLL_PCT: ${{ vars.MAX_EXPOSURE_BANKROLL_PCT || '90' }}
          MAX_EXPOSURE_ABS: ${{ vars.MAX_EXPOSURE_ABS || '55' }}
          # --- sizing model ---
          KELLY_FRACTION: ${{ vars.KELLY_FRACTION || '0.25' }}
          BIAS_CONFIDENCE: ${{ vars.BIAS_CONFIDENCE || '0.5' }}
          MAX_BANKROLL_PCT: ${{ vars.MAX_BANKROLL_PCT || '5' }}
          # --- daily circuit breakers ---
          # Bound the worst realistic DAY, which no other cap does: the
          # exposure cap alone would let ~90% of a $50 bankroll out in one run.
          # 0 = place nothing. The favourite model is wound down: it filled
          # 0 of 7 orders while every market moved away from its resting bid,
          # because a bid below fair value only fills when the price falls to
          # you — i.e. only on the trades where you were wrong. The runner
          # still executes so its TTL sweep cancels the stale bids it left.
          MAX_ORDERS_PER_DAY: ${{ vars.MAX_ORDERS_PER_DAY || '0' }}
          MAX_DAILY_DEPLOY_USD: ${{ vars.MAX_DAILY_DEPLOY_USD || '15' }}
          # Correlated bets are one bet. The first live scan returned 12 of 14
          # signals resolving off a single CPI print; without this, one theme
          # could consume the whole daily budget across ~70 scans.
          MAX_ORDERS_PER_THEME_PER_DAY: ${{ vars.MAX_ORDERS_PER_THEME_PER_DAY || '3' }}
          # How long a maker bid may rest before it is pulled and re-priced.
          # Without this an 86c bid sat in a book closing 142h out, free to be
          # picked off after the market walked away from it.
          RESTING_TTL_H: ${{ vars.RESTING_TTL_H || '6' }}
        run: python favorite_runner.py

      - name: Sports — sharp consensus vs Kalshi (TAKER)
        # The live strategy. Takes the ask instead of resting inside it, sizes
        # each pick off its own edge at full Kelly, and records signed steam,
        # home/away and underdog on every signal so CLV can test which of them
        # predicts beating the close. None of the three is priced in.
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY_PATH: kalshi_prod.pem
          KALSHI_ENV: ${{ vars.KALSHI_ENV || 'prod' }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          KILL_SWITCH: ${{ vars.KILL_SWITCH || 'false' }}
          DRY_RUN: ${{ inputs.dry_run || vars.DRY_RUN || 'false' }}
          MAX_ORDER_SIZE: ${{ vars.MAX_ORDER_SIZE || '3' }}
          MAX_TOTAL_EXPOSURE: ${{ vars.MAX_TOTAL_EXPOSURE || '45' }}
          # Raised with the sizing model: a 5% gate here would silently clip
          # every 20% bet the sizer produced, and the order would look sized
          # while actually being capped somewhere else entirely.
          MAX_ORDER_BANKROLL_PCT: ${{ vars.MAX_ORDER_BANKROLL_PCT || '20' }}
          MAX_ORDER_ABS: ${{ vars.MAX_ORDER_ABS || '10' }}
          MAX_EXPOSURE_BANKROLL_PCT: ${{ vars.MAX_EXPOSURE_BANKROLL_PCT || '90' }}
          MAX_EXPOSURE_ABS: ${{ vars.MAX_EXPOSURE_ABS || '55' }}
          # FULL Kelly with a 20%-of-bankroll ceiling (owner call, 2026-08-08).
          # Full Kelly maximises growth only if the edge estimate is right, and
          # on this account it still has zero scored CLV samples. The ceiling
          # and the daily cap below are what bound being wrong.
          KELLY_FRACTION: ${{ vars.KELLY_FRACTION || '1.0' }}
          MAX_BANKROLL_PCT: ${{ vars.MAX_BANKROLL_PCT || '20' }}
          # 0.25, not 0.52. A floor above 0.50 could only ever back FAVOURITES —
          # an underdog is a side the model puts under 50% by definition — and
          # the moneyline leg reported "0 qualifying" on every run of its life.
          # This opens the 25-50% band and stops there: below it the
          # favourite-longshot bias makes apparent edge more likely to be our
          # own model error than a real mispricing.
          SPORTS_MIN_PROB: ${{ vars.SPORTS_MIN_PROB || '0.25' }}
          # Bounds the DAY. SPORTS_MAX_*_PER_DAY cap how MANY bets, never how
          # much money; four picks at up to 20% each is ~80% of the bankroll
          # between two sunrises. Orders are trimmed to fit, not dropped.
          SPORTS_MAX_DAILY_USD: ${{ vars.SPORTS_MAX_DAILY_USD || '18' }}
          # Steam is measured, not required — requiring it meant always buying
          # the post-move price, which is why CLV was -6.0c.
          SPORTS_REQUIRE_STEAM: ${{ vars.SPORTS_REQUIRE_STEAM || 'false' }}
          # Sanity ceiling on edge. A devigged consensus of the same public
          # books Kalshi reads cannot disagree by 58c; when it appears to, we
          # priced the wrong contract. On 2026-08-07 exactly that bought a WNBA
          # championship future because the series ticker pointed at the season
          # market instead of the game. Kelly stakes hardest where the number is
          # most absurd, so the ceiling has to sit upstream of sizing.
          SPORTS_MAX_EDGE_CENTS: ${{ vars.SPORTS_MAX_EDGE_CENTS || '25' }}
          # Above this edge the STARTING PITCHING must not contradict the side
          # being backed. The books already price the starters, so this cannot
          # sharpen fair value — it catches a number that is not about this
          # game. Both bad trades this month were exactly that, and the second
          # one bought the Angels (7.27 ERA starter) against Texas (3.56) on a
          # 21.4c "edge". Free: the same ESPN scoreboard live_scan polls, no
          # odds credits. Missing starters fail OPEN so an unposted lineup
          # cannot disable the model.
          SPORTS_CORROBORATE_ABOVE_CENTS: ${{ vars.SPORTS_CORROBORATE_ABOVE_CENTS || '10' }}
          PITCHER_ERA_GAP: ${{ vars.PITCHER_ERA_GAP || '1.50' }}
          # MLB only while the free tier is exhausted. NFL and NHL are
          # "active" out of season, so each run spent 2 credits on them and got
          # zero games inside the 36h window — 4 of every 8 credits bought
          # nothing. Restore the full list when the quota resets.
          SPORTS_LEAGUES: ${{ vars.SPORTS_LEAGUES || 'mlb' }}
          # ONE budget across both bet types, filled by edge. Two reserved
          # pools of 2 meant an empty moneyline day wasted two slots while
          # better totals went untaken — and moneylines were empty every run
          # for a week. Leave the per-kind vars unset so they do not bind.
          SPORTS_MAX_PER_DAY: ${{ vars.SPORTS_MAX_PER_DAY || '4' }}
          # The free Odds API tier is 500 credits/month and a call costs
          # markets x regions = 2. One pass per run at ~1 in-season league is
          # ~2 credits; at ~24 runs/day that is ~1440/month, so --once and the
          # in-season filter (a free endpoint) are what keep us inside budget.
          # Stop before the quota is gone so a reserve survives to the reset.
          # Reserve lowered 50 -> 10. At 50 the reserve equalled the whole
          # remaining balance, so the model could never spend a credit AND had
          # no cache to fall back on: it went completely dark. 10 leaves a
          # small buffer while letting the cache be refreshed.
          ODDS_MIN_REMAINING: ${{ vars.ODDS_MIN_REMAINING || '4' }}
          # BOTH markets. The daily budget is one pool filled by edge, so
          # the model needs both bet types on the table to pick the best of
          # them — fetching totals only would decide the question by removing
          # half the candidates.
          #
          # The cost is honest: a call is markets x regions = 2 credits, so
          # 46 usable credits buy 23 refreshes across the ~27 days to reset —
          # about 0.85 a day, not quite one. The lead-time gate concentrates
          # those on days with games, so in practice it is a refresh on most
          # days rather than every day. Halving it to one market would buy the
          # daily guarantee at the price of the choice, which is the wrong
          # trade now that the budget is pooled.
          ODDS_MARKETS: ${{ vars.ODDS_MARKETS || 'h2h,totals' }}
          # How stale cached lines may get before paying for a refresh. At MLB
          # only this is ~2 credits/day against ~40 usable, which reaches the
          # monthly reset. THE MODEL EVALUATES ON EVERY RUN REGARDLESS — only
          # the paid refresh is rationed.
          ODDS_CACHE_TTL_MIN: ${{ vars.ODDS_CACHE_TTL_MIN || '1440' }}
          # Do not pay to re-price a slate we cannot bet on yet. Budget maths:
          # 500 credits/month / (markets x regions = 2) = 250 calls = 8.3/day,
          # i.e. a 3h TTL is the exact break-even at one league. The 24h TTL
          # above is set for the ~40 credits left until the September reset;
          # drop it to 180 once the quota rolls over. This lead-time gate is
          # what makes that affordable — it skips the overnight refreshes on a
          # slate that is clustered in the evening.
          ODDS_REFRESH_LEAD_H: ${{ vars.ODDS_REFRESH_LEAD_H || '14' }}
          # WHEN to spend the day's one paid refresh. Measured across every open
          # KXMLBGAME market on 2026-08-12: Kalshi's makers hold a 1c spread
          # from 8h out to 40h, so buying early gains no width — median volume
          # 8,250 at 8-16h, 2,963 at 16-28h, 196 at 28-40h, and beyond 40h the
          # book is dead (0 volume, 4c). What varies is the OTHER side: an
          # overnight sportsbook line is soft and low-limit, so a "sharp
          # consensus" taken at 04:00 UTC is a consensus of nobody. 14-16 UTC is
          # 10am-12pm ET, when real limits are up — it catches 1pm ET day games
          # at 1-3h out and 7-9pm ET games at 7-11h out.
          ODDS_REFRESH_WINDOW_UTC: ${{ vars.ODDS_REFRESH_WINDOW_UTC || '14-16' }}
          # The window must never starve the model. GitHub dropped 32 of an
          # expected 48 scheduled runs on a measured day, so a two-hour window
          # can be missed entirely; past this age the clock is ignored.
          ODDS_CACHE_HARD_MAX_MIN: ${{ vars.ODDS_CACHE_HARD_MAX_MIN || '2160' }}
          SPORTS_RUN_MINUTES: '0'
        run: python sports_runner.py --once

      - name: Live (in-play) win expectancy vs Kalshi — RECORD ONLY
        # Places nothing. Records every comparison between our win-expectancy
        # model and Kalshi's live price so "does an in-play edge exist at our
        # latency?" gets a measured answer instead of an opinion.
        #
        # The first observation was not encouraging: HOU@SD, bottom 2nd, Kalshi
        # quoted a 1c spread on 2.4M contracts and disagreed with the model by
        # 1.2c — less than the ~1.7c taker fee. In-play is the TIGHTEST market
        # on the exchange, not the loosest. Hence measure before trading.
        #
        # Costs no odds credits: ESPN's public scoreboard is free and unlimited.
        # !cancelled() so a Kalshi hiccup in an earlier step cannot silently
        # skip the measurement.
        if: ${{ !cancelled() }}
        env:
          KALSHI_ENV: ${{ vars.KALSHI_ENV || 'prod' }}
          LIVE_MIN_EDGE_CENTS: ${{ vars.LIVE_MIN_EDGE_CENTS || '7' }}
          LIVE_MAX_EDGE_CENTS: ${{ vars.LIVE_MAX_EDGE_CENTS || '20' }}
        run: python live_scan.py

      - name: Snapshot open prices, confirm fills, score CLV
        # Runs every cycle regardless of whether anything was placed. This is
        # where resting orders get confirmed against the exchange's own fills
        # and the closing line is captured while markets are still OPEN.
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY_PATH: kalshi_prod.pem
          KALSHI_ENV: ${{ vars.KALSHI_ENV || 'prod' }}
        run: python clv_tracker.py

      - name: Persist state to the bot-state branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name "favorite-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/state"
          for f in $STATE_FILES; do
            if [ -f "$f" ]; then cp "$f" "$RUNNER_TEMP/state/"; fi
          done
          if git ls-remote --exit-code --heads origin bot-state >/dev/null; then
            git fetch --depth=1 origin bot-state
            # -f is required, not cosmetic: the restore step above rewrites
            # state files that may also be tracked on main, which leaves the
            # tree dirty. A plain checkout then refuses to switch branches
            # ("local changes would be overwritten") and the run dies AFTER
            # placing orders — trades made, state lost. Discarding is safe
            # because every state file was already copied to $RUNNER_TEMP.
            git checkout -f -B bot-state origin/bot-state
          else
            git checkout --orphan bot-state
            git rm -rf --cached . >/dev/null
            find . -maxdepth 1 -mindepth 1 -not -name .git -exec rm -rf {} +
          fi
          for f in $STATE_FILES; do
            if [ -f "$RUNNER_TEMP/state/$f" ]; then
              cp "$RUNNER_TEMP/state/$f" "$f"
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin bot-state
          fi
